<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kairo · Sistema de Decisión Mensual</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --ink:         #0F1419;
  --ink-soft:    #3D4147;
  --ink-muted:   #6B6F75;
  --ink-faint:   #A8ACB1;

  --paper:       #FAFAF7;
  --paper-warm:  #F2EFE7;
  --paper-deep:  #E5E2D8;
  --rule:        #DDD8CC;

  --accent:      #1A4D3E;
  --accent-soft: #E8EEEB;
  --accent-ink:  #0E2E25;

  --signal:      #B8501C;
  --signal-soft: #F4E8DD;
  --signal-ink:  #8E3C12;

  --positive:      #3B6E3B;
  --positive-soft: #E8EFE5;
  --warning:       #B8821C;
  --warning-soft:  #F5ECD9;
  --negative:      #A8351F;
  --negative-soft: #F4E2DC;

  --font-serif: 'Fraunces', 'Times New Roman', Georgia, serif;
  --font-sans:  'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:  'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --shadow-sheet: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.08);
  --shadow-card:  0 1px 2px rgba(0,0,0,0.03), 0 2px 8px rgba(0,0,0,0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--paper-deep);
  color: var(--ink);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
}

/* ── Layout ── */
.db-app {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
  background: var(--paper);
}

/* ── Sidebar ── */
.db-side {
  background: var(--paper-warm);
  border-right: 0.5px solid var(--rule);
  padding: 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 28px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.db-side .wordmark {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 28px;
  line-height: 0.85;
  letter-spacing: -0.04em;
  color: var(--ink);
}
.db-side .wordmark sup {
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  vertical-align: super;
  color: var(--ink-muted);
  margin-left: 2px;
}

.db-side .group-label {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 8px;
  padding-left: 4px;
}

.db-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.db-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  font-family: var(--font-sans);
  font-size: 13px;
  color: var(--ink-soft);
  cursor: pointer;
  border-radius: 4px;
  transition: background 160ms cubic-bezier(0.2,0.6,0.2,1);
  user-select: none;
}
.db-nav-item:hover { background: rgba(15,20,25,0.04); }
.db-nav-item.active {
  background: var(--paper);
  color: var(--ink);
  font-weight: 500;
  box-shadow: inset 2px 0 0 var(--accent);
}
.db-nav-item .num {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 300;
  font-size: 12px;
  color: var(--ink-faint);
  width: 14px;
  flex-shrink: 0;
}
.db-nav-item.active .num { color: var(--accent); }
.db-nav-item .icon { width: 14px; height: 14px; stroke-width: 1.5; flex-shrink: 0; }

.db-side .client-card {
  margin-top: auto;
  background: var(--paper);
  border: 0.5px solid var(--rule);
  padding: 12px;
}
.db-side .client-card .label {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 4px;
}
.db-side .client-card .name {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 15px;
  letter-spacing: -0.015em;
  color: var(--ink);
  line-height: 1.15;
}
.db-side .client-card .meta {
  font-family: var(--font-sans);
  font-size: 10px;
  color: var(--ink-muted);
  margin-top: 4px;
}

/* ── Main ── */
.db-main {
  padding: 28px 32px 40px;
  overflow: auto;
}

/* ── Topbar ── */
.db-top {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: end;
  gap: 24px;
  padding-bottom: 18px;
  border-bottom: 0.5px solid var(--ink);
  margin-bottom: 24px;
}
.db-top h1 {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: 32px;
  letter-spacing: -0.025em;
  line-height: 1.1;
  color: var(--ink);
}
.db-top h1 em { font-style: italic; font-weight: 400; }
.db-top .sub {
  font-family: var(--font-sans);
  font-size: 11px;
  color: var(--ink-muted);
  margin-top: 6px;
  letter-spacing: 0.02em;
}
.db-top .sub b { color: var(--ink-soft); font-weight: 500; }

.db-top-right {
  display: flex;
  gap: 8px;
  align-items: center;
}
.db-chip {
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-soft);
  padding: 6px 12px;
  border: 0.5px solid var(--rule);
  background: var(--paper);
  cursor: pointer;
  transition: all 160ms cubic-bezier(0.2,0.6,0.2,1);
  border-radius: 0;
}
.db-chip:hover { background: var(--paper-warm); }
.db-chip.active {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

/* ── Section label ── */
.db-section-label {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-muted);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.db-section-label::before {
  content: '';
  width: 14px;
  height: 0.5px;
  background: var(--ink-muted);
}
.db-section-label .num {
  font-family: var(--font-serif);
  color: var(--accent);
  font-size: 10px;
}

/* ── KPI grid ── */
.db-kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 28px;
}
.db-kpi {
  background: var(--paper);
  border: 0.5px solid var(--rule);
  padding: 16px 18px 18px;
}
.db-kpi.featured {
  background: var(--accent-soft);
  border-color: transparent;
}
.db-kpi .lab {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.db-kpi.featured .lab { color: var(--accent); }
.db-kpi .val {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: 36px;
  letter-spacing: -0.025em;
  color: var(--ink);
  margin-top: 10px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.db-kpi.featured .val { color: var(--accent); }
.db-kpi .val .unit { font-size: 18px; color: var(--ink-muted); margin-left: 2px; }
.db-kpi .delta {
  font-family: var(--font-sans);
  font-size: 10.5px;
  color: var(--ink-muted);
  margin-top: 10px;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.db-kpi .delta .num { font-weight: 500; }
.db-kpi .delta.up   .num { color: #3B6E3B; }
.db-kpi .delta.down .num { color: #A8351F; }

/* ── Panels ── */
.db-panel {
  background: var(--paper);
  border: 0.5px solid var(--rule);
  padding: 18px 20px 20px;
}
.db-panel .head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 0.5px solid var(--rule);
}
.db-panel h2 {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 14px;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.db-panel .meta {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 11px;
  font-weight: 300;
  color: var(--ink-muted);
}

.db-row-2 {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 14px;
  margin-bottom: 14px;
}
.db-row-2b {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

/* ── Bar list ── */
.db-bars { display: flex; flex-direction: column; gap: 10px; }
.db-bar-row {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
}
.db-bar-row .lab {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-sans);
  font-size: 11px;
}
.db-bar-row .lab .name { color: var(--ink); }
.db-bar-row .lab .val { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.db-bar-track {
  height: 6px;
  background: var(--paper-warm);
  position: relative;
  overflow: hidden;
}
.db-bar-fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--accent);
  transition: width 600ms cubic-bezier(0.2, 0.6, 0.2, 1);
}
.db-bar-fill.warm  { background: var(--signal); }
.db-bar-fill.muted { background: var(--ink-faint); }

/* ── Client table ── */
.db-table { width: 100%; border-collapse: collapse; }
.db-table th {
  text-align: left;
  padding: 6px 10px 10px 0;
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-muted);
  border-bottom: 0.5px solid var(--ink);
}
.db-table th.num,
.db-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.db-table td {
  padding: 10px 10px 10px 0;
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--ink-soft);
  border-bottom: 0.5px solid var(--rule);
}
.db-table td.name { color: var(--ink); }
.db-table tr:last-child td { border-bottom: none; }

.db-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--ink-soft);
}
.db-status .dot {
  width: 7px;
  height: 7px;
  border-radius: 99px;
  flex-shrink: 0;
}
.db-status.ok   .dot { background: #3B6E3B; }
.db-status.warn .dot { background: #B8821C; }
.db-status.bad  .dot { background: #A8351F; }
.db-status.muted .dot { background: #A8ACB1; }

/* ── Alert stack ── */
.db-alerts { display: flex; flex-direction: column; gap: 10px; }
.db-alert {
  display: grid;
  grid-template-columns: 16px 1fr auto;
  gap: 10px;
  padding: 10px 12px;
  font-family: var(--font-sans);
  font-size: 11px;
  line-height: 1.55;
  color: var(--ink-soft);
  align-items: start;
}
.db-alert .mark {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 12px;
  line-height: 1.4;
}
.db-alert.warn { background: var(--warning-soft); }
.db-alert.warn .mark { color: var(--warning); }
.db-alert.bad  { background: var(--negative-soft); }
.db-alert.bad  .mark { color: var(--negative); }
.db-alert.ok   { background: var(--positive-soft); }
.db-alert.ok   .mark { color: var(--positive); }
.db-alert b { color: var(--ink); font-weight: 500; }
.db-alert .when {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 10px;
  font-weight: 300;
  color: var(--ink-muted);
  white-space: nowrap;
  padding-top: 1px;
}

/* ── Chart legend ── */
.chart-legend {
  display: flex;
  gap: 18px;
  margin-top: 8px;
  font-family: var(--font-sans);
  font-size: 10.5px;
  color: var(--ink-muted);
}
.chart-legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* ── Footer ── */
.db-foot {
  margin-top: 28px;
  padding-top: 14px;
  border-top: 0.5px solid var(--rule);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 16px;
  align-items: center;
  font-family: var(--font-sans);
  font-size: 10px;
  color: var(--ink-muted);
}
.db-foot .center {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 400;
  color: var(--ink-soft);
}
.db-foot .right { text-align: right; }
</style>
</head>
<body>
<div id="app"></div>

<script type="text/babel">
const { useState, useEffect } = React;

/* ── Data ── */
const SALES  = [142, 138, 151, 149, 162, 158, 171, 165, 173, 168, 176, 184];
const BUDGET = [150, 150, 155, 155, 160, 160, 165, 165, 170, 175, 180, 185];

const BARS_CATEGORY = [
  { name: "Obra gruesa",   label: "$ 82M · 45%", value: 82, tone: "" },
  { name: "Terminaciones", label: "$ 41M · 22%", value: 41, tone: "" },
  { name: "Instalaciones", label: "$ 28M · 15%", value: 28, tone: "warm" },
  { name: "Logística",     label: "$ 19M · 10%", value: 19, tone: "muted" },
  { name: "Otros",         label: "$ 14M · 8%",  value: 14, tone: "muted" },
];

const CLIENT_ROWS = [
  { name: "Inmobiliaria del Sur", sector: "Construcción",       income: "$ 142.180.000", dso: "38 d", status: "ok",    statusLabel: "Al día" },
  { name: "Agrícola del Maule",   sector: "Agroindustria",      income: "$ 88.500.000",  dso: "52 d", status: "warn",  statusLabel: "Revisar" },
  { name: "Distribuidora Talca",  sector: "Comercio mayorista", income: "$ 61.420.000",  dso: "71 d", status: "bad",   statusLabel: "Acción urgente" },
  { name: "Maderas Linares",      sector: "Manufactura",        income: "$ 44.900.000",  dso: "29 d", status: "ok",    statusLabel: "Al día" },
  { name: "Clínica Curicó",       sector: "Salud privada",      income: "$ 38.620.000",  dso: "—",    status: "muted", statusLabel: "Sin datos" },
];

const ALERTS = [
  { tone: "bad",  title: "Distribuidora Talca:",      body: "DSO subió a 71 días. Hay $14.2M sobre los 60 días. Sugerencia: cobrador asignado esta semana.",       when: "hace 2 días" },
  { tone: "warn", title: "Categoría Instalaciones:",  body: "cuatro días sin venta. Verificar quiebre de stock en Talca-norte antes del viernes.",                  when: "ayer" },
  { tone: "ok",   title: "Margen bruto sobre presupuesto.", body: "Cerraste febrero 1,8 pts por encima de meta. Mantener mix actual de obra gruesa.",              when: "29 feb" },
];

/* ── Sidebar ── */
function Sidebar({ active, onPick }) {
  const dashboards = [
    { id: "ventas",   roman: "i",   label: "Ventas",      icon: "trending-up" },
    { id: "costos",   roman: "ii",  label: "Costos",      icon: "wallet" },
    { id: "ops",      roman: "iii", label: "Operaciones", icon: "boxes" },
    { id: "clientes", roman: "iv",  label: "Clientes",    icon: "users" },
    { id: "cash",     roman: "v",   label: "Cash flow",   icon: "banknote" },
  ];
  const tools = [
    { id: "exp", label: "Exportar PDF",    icon: "download" },
    { id: "rev", label: "Reunión mensual", icon: "calendar" },
    { id: "msg", label: "Avisar a Joaquín", icon: "message-square" },
  ];

  return (
    <aside className="db-side">
      <div className="wordmark">Kairo<sup>cl</sup></div>

      <div>
        <div className="group-label">Tableros</div>
        <nav className="db-nav">
          {dashboards.map(d => (
            <div
              key={d.id}
              className={`db-nav-item ${active === d.id ? "active" : ""}`}
              onClick={() => onPick(d.id)}
            >
              <span className="num">{d.roman}</span>
              <i data-lucide={d.icon} className="icon"></i>
              <span>{d.label}</span>
            </div>
          ))}
        </nav>
      </div>

      <div>
        <div className="group-label">Acciones</div>
        <nav className="db-nav">
          {tools.map(t => (
            <div key={t.id} className="db-nav-item">
              <span className="num"></span>
              <i data-lucide={t.icon} className="icon"></i>
              <span>{t.label}</span>
            </div>
          ))}
        </nav>
      </div>

      <div className="client-card">
        <div className="label">Cliente</div>
        <div className="name">Constructora Ñiquén Ltda.</div>
        <div className="meta">RUT 76.421.880-3 · Talca</div>
      </div>
    </aside>
  );
}

/* ── Topbar ── */
function Topbar({ period, setPeriod }) {
  const periods = ["Hoy", "Semana", "Mes", "Trimestre", "Año"];
  return (
    <div className="db-top">
      <div>
        <h1>Vista <em>ejecutiva</em> · marzo 2026</h1>
        <div className="sub">
          <b>Última sincronización</b> hoy a las 06:48 · datos del ERP, banco y planilla de obra.
        </div>
      </div>
      <div className="db-top-right">
        {periods.map(p => (
          <button
            key={p}
            className={`db-chip ${period === p ? "active" : ""}`}
            onClick={() => setPeriod(p)}
          >{p}</button>
        ))}
      </div>
    </div>
  );
}

/* ── KPI Tile ── */
function KPITile({ label, value, unit, delta, deltaLabel, dir = "up", featured = false }) {
  return (
    <div className={`db-kpi ${featured ? "featured" : ""}`}>
      <div className="lab">{label}</div>
      <div className="val">
        {value}
        {unit && <span className="unit">{unit}</span>}
      </div>
      <div className={`delta ${dir}`}>
        <span className="num">{dir === "up" ? "▲" : "▼"} {delta}</span>
        <span>{deltaLabel}</span>
      </div>
    </div>
  );
}

/* ── Trend Chart (SVG) ── */
function TrendChart({ data, budget }) {
  const W = 640, H = 220, PAD = 32;
  const max = Math.max(...data, ...budget) * 1.1;
  const x = i => PAD + (i * (W - PAD * 2)) / (data.length - 1);
  const y = v => H - PAD - (v / max) * (H - PAD * 2);
  const linePath   = data.map((v, i) => `${i === 0 ? "M" : "L"} ${x(i)} ${y(v)}`).join(" ");
  const budgetPath = budget.map((v, i) => `${i === 0 ? "M" : "L"} ${x(i)} ${y(v)}`).join(" ");
  const months = ["Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic","Ene","Feb","Mar"];

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: 220, fontFamily: "var(--font-mono)" }}>
      {[0.25, 0.5, 0.75, 1].map((f, i) => (
        <line key={i}
          x1={PAD} x2={W - PAD}
          y1={y(max * f)} y2={y(max * f)}
          stroke="#DDD8CC" strokeWidth="0.5"
        />
      ))}
      <path d={budgetPath} fill="none" stroke="#A8ACB1" strokeWidth="1" strokeDasharray="3 3"/>
      <path d={linePath}   fill="none" stroke="#1A4D3E" strokeWidth="1.5"/>
      {data.map((v, i) => (
        <circle key={i}
          cx={x(i)} cy={y(v)}
          r={i === data.length - 1 ? 4 : 2}
          fill={i === data.length - 1 ? "#B8501C" : "#1A4D3E"}
        />
      ))}
      {months.map((m, i) => (
        <text key={i} x={x(i)} y={H - 8} fontSize="9" fill="#6B6F75" textAnchor="middle">{m}</text>
      ))}
      <text
        x={x(data.length - 1)}
        y={y(data[data.length - 1]) - 10}
        fontSize="11" fill="#B8501C" textAnchor="middle"
        style={{ fontFamily: "var(--font-serif)", fontWeight: 500 }}
      >
        ${data[data.length - 1]}M
      </text>
    </svg>
  );
}

/* ── Bar List ── */
function BarList({ items }) {
  const max = Math.max(...items.map(i => i.value));
  return (
    <div className="db-bars">
      {items.map((it, i) => (
        <div className="db-bar-row" key={i}>
          <div className="lab">
            <span className="name">{it.name}</span>
            <span className="val">{it.label}</span>
          </div>
          <div className="db-bar-track">
            <div
              className={`db-bar-fill ${it.tone || ""}`}
              style={{ width: `${(it.value / max) * 100}%` }}
            />
          </div>
        </div>
      ))}
    </div>
  );
}

/* ── Client Table ── */
function ClientTable({ rows }) {
  return (
    <table className="db-table">
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Sector</th>
          <th className="num">Ingreso 12m</th>
          <th className="num">DSO</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        {rows.map((r, i) => (
          <tr key={i}>
            <td className="name">{r.name}</td>
            <td>{r.sector}</td>
            <td className="num">{r.income}</td>
            <td className="num">{r.dso}</td>
            <td>
              <span className={`db-status ${r.status}`}>
                <span className="dot"></span>
                {r.statusLabel}
              </span>
            </td>
          </tr>
        ))}
      </tbody>
    </table>
  );
}

/* ── Alert Stack ── */
function AlertStack({ alerts }) {
  const marks = { warn: "!", bad: "§", ok: "✓" };
  return (
    <div className="db-alerts">
      {alerts.map((a, i) => (
        <div className={`db-alert ${a.tone}`} key={i}>
          <span className="mark">{marks[a.tone]}</span>
          <span><b>{a.title}</b> {a.body}</span>
          <span className="when">{a.when}</span>
        </div>
      ))}
    </div>
  );
}

/* ── Section Label ── */
function SectionLabel({ num, children }) {
  return (
    <div className="db-section-label">
      <span className="num">{num}</span>
      {children}
    </div>
  );
}

/* ── Footer ── */
function DashboardFooter() {
  return (
    <footer className="db-foot">
      <div>Kairo · Sistema de Decisión Mensual</div>
      <div className="center">El momento exacto de decidir</div>
      <div className="right">kairobicl@gmail.com · +56 9 4050 7498</div>
    </footer>
  );
}

      <main className="db-main">

        <SectionLabel num="01">Indicadores clave del mes</SectionLabel>

          <KPITile         label="Margen bruto"              value="31,2"   unit="%"       delta="1,1 pp" deltaLabel="vs. presupuesto"   dir="down"/>
          <KPITile         label="DSO · cuentas por cobrar"  value="42"     unit=" días"   delta="4 días" deltaLabel="mejor que objetivo" dir="up"/>
          <KPITile         label="Costos ocultos detectados" value="$8,4M"  delta="acumulado YTD" deltaLabel="" dir="up"/>
        </div>

        <SectionLabel num="02">Evolución y mezcla de ventas</SectionLabel>
        <div className="db-row-2">
          <div className="db-panel">
            <div className="head">
              <h2>Ventas mensuales vs. presupuesto</h2>
              <div className="meta">12 meses móviles · CLP millones</div>
            </div>
            <TrendChart data={SALES} budget={BUDGET}/>
            <div className="chart-legend">
              <span>
                <span style={{ width: 16, height: 1.5, background: "#1A4D3E", display: "inline-block" }}></span>
                Ventas reales
              </span>
              <span>
                <span style={{ width: 16, height: 1, background: "#A8ACB1", display: "inline-block", borderTop: "1px dashed #A8ACB1" }}></span>
                Presupuesto
              </span>
            </div>
          </div>
          <div className="db-panel">
            <div className="head">
              <h2>Ventas por categoría</h2>
              <div className="meta">marzo · CLP</div>
            </div>
            <BarList items={BARS_CATEGORY}/>
          </div>
        </div>

        <SectionLabel num="03">Operación y alertas</SectionLabel>
        <div className="db-row-2b">
          <div className="db-panel">
            <div className="head">
              <h2>Clientes principales</h2>

            </div>

          <div className="db-panel">

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
